<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa de donación de sangre · Comunitat Valenciana</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🩸</text></svg>">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1><span class="drop">🩸</span> Dona sangre</h1>
  <div class="filters">
    <label>Desde <input type="date" id="from"></label>
    <label>Hasta <input type="date" id="to"></label>
    <button type="button" id="today">Hoy</button>
    <button type="button" id="week">7 días</button>
    <button type="button" id="all">Todo</button>
  </div>
  <span id="count" class="count"></span>
  <small>
    Actualizado <span id="updated">…</span> UTC ·
    <a href="https://centro-transfusion.san.gva.es/es/puntos-de-donacion" target="_blank" rel="noopener">fuente oficial</a> ·
    <a href="https://github.com/elKei24/sangre-vlc" target="_blank" rel="noopener">GitHub</a>
  </small>
</header>
<div id="map"></div>
<footer id="missing" hidden></footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="app.js"></script>
</body>
</html>
