name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/test_scrape.py
      - run: node --check docs/app.js
      - run: for f in *.json docs/*.json scripts/*.json .github/*.json; do python3 -m json.tool "$f" > /dev/null; done
