name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "$TITLE" | grep -Eq '^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([^)]+\))?!?: .+' \
            || { echo "PR title must follow Conventional Commits, e.g. 'feat: add filter'"; exit 1; }
      - uses: actions/checkout@v7
      - run: python3 scripts/test_scrape.py
      - run: node --check site/app.js
      - run: for f in *.json site/*.json scripts/*.json .github/*.json; do python3 -m json.tool "$f" > /dev/null; done
