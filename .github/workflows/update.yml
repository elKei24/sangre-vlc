name: Update donation data

on:
  schedule:
    - cron: "15 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 scrape.py
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add data.json geocache.json
          git diff --cached --quiet || git commit -m "chore: update donation data" && git push
